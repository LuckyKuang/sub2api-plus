interface:
  display_name: "Sub2API Release CLI"
  short_description: "Prepare, tag, publish, and verify releases safely"
  default_prompt: "Use $release-cli with an exact typed push-cli proof and protected GitHub auto-merge: release candidates require CI and Security Scan at the exact merged-main SHA for tag provenance; deterministic finalization requires focused PR gates and verification of the actual merge parents/tree, main containment, and [skip ci] merge subject, without waiting for skipped main workflows. Keep tag, publish, monitor, verify, and finalize separate and resumable; never use admin bypass, approve a deployment, or repeat the full application matrix for an unchanged tag or finalization tree."
