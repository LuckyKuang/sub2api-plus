name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: read

# GoReleaser also updates the shared latest, major, and minor GHCR tags.
# Serialize releases so simultaneous tag pushes cannot race on those manifests.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release provenance
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and verify release provenance
        id: provenance
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          TAG_REF="refs/tags/$TAG_NAME"
          git show-ref --verify --quiet "$TAG_REF" || {
            echo "Tag does not exist: $TAG_NAME" >&2
            exit 1
          }
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "Release tag must be annotated: $TAG_NAME" >&2
            exit 1
          fi

          TARGET_SHA="$(git rev-parse "$TAG_REF^{}")"
          if [ "$TARGET_SHA" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit does not match $TAG_NAME" >&2
            exit 1
          fi

          EXPECTED_SUBJECT="Sub2API Plus $TAG_NAME"
          TAG_SUBJECT="$(git for-each-ref --format='%(contents:subject)' "$TAG_REF")"
          if [ "$TAG_SUBJECT" != "$EXPECTED_SUBJECT" ]; then
            echo "Tag subject must be: $EXPECTED_SUBJECT" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-provenance-notes.md"
          git for-each-ref --format='%(contents)' "$TAG_REF" > "$NOTES_FILE"
          git fetch --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$TARGET_SHA" "origin/$DEFAULT_BRANCH" || {
            echo "$TAG_NAME target is not contained by origin/$DEFAULT_BRANCH" >&2
            exit 1
          }

          {
            echo "tag=$TAG_NAME"
            echo "target=$TARGET_SHA"
            echo "notes_file=$NOTES_FILE"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release metadata and notes
        run: |
          python tools/check_release.py \
            --tag "${{ steps.provenance.outputs.tag }}" \
            --notes-file "${{ steps.provenance.outputs.notes_file }}" \
            --require-status planned

      - name: Verify exact main workflow evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/workflow_provenance.py \
            --repository "$GITHUB_REPOSITORY" \
            --branch "${{ github.event.repository.default_branch }}" \
            --sha "${{ steps.provenance.outputs.target }}"

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    # release-cli requires this environment to disable administrator bypass,
    # have no blocking approval gate, and allow only v*+custom.* tags.
    environment:
      name: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and verify release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          TAG_REF="refs/tags/$TAG_NAME"
          git show-ref --verify --quiet "$TAG_REF" || {
            echo "Tag does not exist: $TAG_NAME" >&2
            exit 1
          }
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "Release tag must be annotated: $TAG_NAME" >&2
            exit 1
          fi
          if [ "$(git rev-parse "$TAG_REF^{}")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit does not match $TAG_NAME" >&2
            exit 1
          fi

          EXPECTED_SUBJECT="Sub2API Plus $TAG_NAME"
          TAG_SUBJECT="$(git for-each-ref --format='%(contents:subject)' "$TAG_REF")"
          if [ "$TAG_SUBJECT" != "$EXPECTED_SUBJECT" ]; then
            echo "Tag subject must be: $EXPECTED_SUBJECT" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          BODY_FILE="$RUNNER_TEMP/release-notes-body.md"
          git for-each-ref --format='%(contents)' "$TAG_REF" > "$NOTES_FILE"
          git for-each-ref --format='%(contents:body)' "$TAG_REF" > "$BODY_FILE"

          DELIMITER="TAG_MESSAGE_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          while grep -Fqx "$DELIMITER" "$BODY_FILE"; do
            DELIMITER="TAG_MESSAGE_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          done
          {
            echo "TAG_MESSAGE<<$DELIMITER"
            cat "$BODY_FILE"
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"

          VERSION="${TAG_NAME#v}"
          DOCKER_TAG="${TAG_NAME/+/-}"
          OWNER_LOWER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$TAG_NAME"
            echo "version=$VERSION"
            echo "docker_tag=$DOCKER_TAG"
            echo "notes_file=$NOTES_FILE"
            echo "owner_lower=$OWNER_LOWER"
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "goreleaser_args=release --clean --skip=validate,announce"
            else
              echo "goreleaser_args=release --clean --skip=validate"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Verify release metadata and notes
        run: |
          python tools/check_release.py \
            --tag "${{ steps.metadata.outputs.tag }}" \
            --notes-file "${{ steps.metadata.outputs.notes_file }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GoReleaser version
        id: goreleaser-version
        run: |
          VERSION="$(awk '$1 == "goreleaser" { print $2 }' .tool-versions)"
          test -n "$VERSION"
          echo "version=v${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release, artifacts, and images
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: ${{ steps.metadata.outputs.goreleaser_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.metadata.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKER_TAG_VERSION: ${{ steps.metadata.outputs.docker_tag }}
          DOCKERHUB_USERNAME: skip

      - name: Publish pricing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          PRICING_RELEASE_DIR="$RUNNER_TEMP/pricing-release"
          EXISTING_ASSET_DIR="$RUNNER_TEMP/existing-pricing-assets"
          mkdir -p "$PRICING_RELEASE_DIR" "$EXISTING_ASSET_DIR"
          cp backend/resources/model-pricing/model_prices_and_context_window.json \
            "$PRICING_RELEASE_DIR/model-pricing.json"
          go -C backend run ./cmd/pricing-manifest-build \
            --data "$PRICING_RELEASE_DIR/model-pricing.json" \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --manifest "$PRICING_RELEASE_DIR/model-pricing-manifest.json"

          assets=(
            model-pricing.json
            model-pricing-manifest.json
          )
          uploads=()
          for asset in "${assets[@]}"; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -Fqx "$asset"; then
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --pattern "$asset" --dir "$EXISTING_ASSET_DIR"
              cmp -- "$PRICING_RELEASE_DIR/$asset" "$EXISTING_ASSET_DIR/$asset" || {
                echo "Refusing to replace immutable pricing asset: $asset" >&2
                exit 1
              }
            else
              uploads+=("$PRICING_RELEASE_DIR/$asset#$asset")
            fi
          done
          if [ "${#uploads[@]}" -gt 0 ]; then
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${uploads[@]}"
          fi
