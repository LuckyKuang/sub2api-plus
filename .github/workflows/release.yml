name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: read

# GoReleaser also updates the shared latest, major, and minor GHCR tags.
# Serialize releases so simultaneous tag pushes cannot race on those manifests.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release ref
    uses: ./.github/workflows/backend-ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
      release-tag: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: read

  release:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve and verify release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]; then
            echo "Invalid release tag: $TAG_NAME" >&2
            exit 1
          fi

          TAG_REF="refs/tags/$TAG_NAME"
          git show-ref --verify --quiet "$TAG_REF" || {
            echo "Tag does not exist: $TAG_NAME" >&2
            exit 1
          }
          if [ "$(git cat-file -t "$TAG_REF")" != "tag" ]; then
            echo "Release tag must be annotated: $TAG_NAME" >&2
            exit 1
          fi
          if [ "$(git rev-parse "$TAG_REF^{}")" != "$(git rev-parse HEAD)" ]; then
            echo "Checked-out commit does not match $TAG_NAME" >&2
            exit 1
          fi

          EXPECTED_SUBJECT="Sub2API Plus $TAG_NAME"
          TAG_SUBJECT="$(git for-each-ref --format='%(contents:subject)' "$TAG_REF")"
          if [ "$TAG_SUBJECT" != "$EXPECTED_SUBJECT" ]; then
            echo "Tag subject must be: $EXPECTED_SUBJECT" >&2
            exit 1
          fi

          NOTES_FILE="$RUNNER_TEMP/release-notes.md"
          BODY_FILE="$RUNNER_TEMP/release-notes-body.md"
          git for-each-ref --format='%(contents)' "$TAG_REF" > "$NOTES_FILE"
          git for-each-ref --format='%(contents:body)' "$TAG_REF" > "$BODY_FILE"

          DELIMITER="TAG_MESSAGE_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          while grep -Fqx "$DELIMITER" "$BODY_FILE"; do
            DELIMITER="TAG_MESSAGE_$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          done
          {
            echo "TAG_MESSAGE<<$DELIMITER"
            cat "$BODY_FILE"
            echo "$DELIMITER"
          } >> "$GITHUB_ENV"

          VERSION="${TAG_NAME#v}"
          DOCKER_TAG="${TAG_NAME/+/-}"
          OWNER_LOWER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$TAG_NAME"
            echo "version=$VERSION"
            echo "docker_tag=$DOCKER_TAG"
            echo "notes_file=$NOTES_FILE"
            echo "owner_lower=$OWNER_LOWER"
            if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "goreleaser_args=release --clean --skip=validate,announce"
            else
              echo "goreleaser_args=release --clean --skip=validate"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Verify release metadata and notes
        run: |
          python tools/check_release.py \
            --tag "${{ steps.metadata.outputs.tag }}" \
            --notes-file "${{ steps.metadata.outputs.notes_file }}"

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve GoReleaser version
        id: goreleaser-version
        run: |
          VERSION="$(awk '$1 == "goreleaser" { print $2 }' .tool-versions)"
          test -n "$VERSION"
          echo "version=v${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Publish release, artifacts, and images
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: ${{ steps.goreleaser-version.outputs.version }}
          args: ${{ steps.metadata.outputs.goreleaser_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.metadata.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKER_TAG_VERSION: ${{ steps.metadata.outputs.docker_tag }}
          DOCKERHUB_USERNAME: skip
