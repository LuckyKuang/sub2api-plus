name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG_NAME="$INPUT_TAG"
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          fi

          VERSION="${TAG_NAME#v}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+custom\.[0-9]{3}$ ]]; then
            echo "Custom releases must use vX.Y.Z+custom.NNN; got: $TAG_NAME" >&2
            exit 1
          fi
          CUSTOM_ITERATION="${VERSION##*.}"
          if (( 10#${CUSTOM_ITERATION} == 0 )); then
            echo "Custom release iteration must be between 001 and 999; got: $TAG_NAME" >&2
            exit 1
          fi
          DOCKER_TAG="${TAG_NAME/+/-}"

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "docker_tag=$DOCKER_TAG" >> "$GITHUB_OUTPUT"
          echo "owner_lower=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "goreleaser_args=release --clean --skip=validate,announce" >> "$GITHUB_OUTPUT"
          else
            echo "goreleaser_args=release --clean --skip=validate" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "tag_message<<EOF"
            git tag -l --format='%(contents:body)' "$TAG_NAME"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Verify embedded version
        run: |
          EMBEDDED_VERSION=$(tr -d '\r\n' < backend/cmd/server/VERSION)
          if [ "$EMBEDDED_VERSION" != "${{ steps.metadata.outputs.version }}" ]; then
            echo "backend/cmd/server/VERSION is $EMBEDDED_VERSION, expected ${{ steps.metadata.outputs.version }}" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release, artifacts, and images
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: ${{ steps.metadata.outputs.goreleaser_args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.metadata.outputs.owner_lower }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKER_TAG_VERSION: ${{ steps.metadata.outputs.docker_tag }}
          DOCKERHUB_USERNAME: skip
          TAG_MESSAGE: ${{ steps.metadata.outputs.tag_message }}
