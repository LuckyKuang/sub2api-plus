name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Source tag or branch for rehearsal; publication requires the same tag workflow ref"
        required: false
        type: string
      dry_run:
        description: "Read-only packaging rehearsal; never publish images or assets"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  SUB2API_VALIDATION_ROOT: ${{ github.workspace }}
  SUB2API_VALIDATION_INPUT_ROOT: ${{ github.workspace }}/.release-tooling/validation-inputs

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Stage immutable workflow tooling
        env:
          TOOLING_SHA: ${{ github.workflow_sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-tooling/actions" "$RUNNER_TEMP/release-tooling/validation"
          cp -R tools "$RUNNER_TEMP/release-tooling/"
          cp -R .github/release-tools "$RUNNER_TEMP/release-tooling/"
          cp -R .github/actions/prepare-validation "$RUNNER_TEMP/release-tooling/actions/"
          cp -R .github/actions/release-package "$RUNNER_TEMP/release-tooling/actions/"
          cp deploy/Dockerfile.validation "$RUNNER_TEMP/release-tooling/validation/"
          cp .tool-versions "$RUNNER_TEMP/release-tooling/validation/tool-versions"
          printf '%s\n' "$TOOLING_SHA" > "$RUNNER_TEMP/release-tooling/revision"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: release-tooling
          path: ${{ runner.temp }}/release-tooling
      - name: Resolve application source once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Stage separate toolchain inputs
        run: |
          cp -R "$RUNNER_TEMP/release-tooling" .release-tooling
          python3 .release-tooling/tools/release_context.py --tooling .release-tooling --output .release-tooling/validation-inputs
      - uses: ./.release-tooling/actions/prepare-validation
        with:
          lane: release-prepare
          launcher: .release-tooling/tools/ci_validation.py
      - name: Capture source, version, date and matrix
        id: plan
        env:
          SOURCE_REF: ${{ inputs.tag || github.ref }}
          REQUEST_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          args=()
          if [ "$REQUEST_DRY_RUN" = true ]; then args+=(--dry-run); fi
          python3 .release-tooling/tools/ci_validation.py exec \
            --env GITHUB_REF --env GITHUB_EVENT_NAME --env GITHUB_REPOSITORY_OWNER -- \
            python3 .release-tooling/release-tools/release_matrix.py plan --ref "$SOURCE_REF" "${args[@]}"
          cat .release-plan/outputs >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: version-file
          path: .release-plan/
          include-hidden-files: true

  verify:
    name: Verify release provenance
    needs: prepare
    if: needs.prepare.outputs.mode != 'branch-rehearsal'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: verify
      - name: Verify annotated tag, metadata and exact main Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 .release-tooling/tools/ci_validation.py exec \
            --env GH_TOKEN --env GITHUB_REPOSITORY --env DEFAULT_BRANCH -- \
            python3 .release-tooling/release-tools/release_job.py verify --strict

  verify-rehearsal:
    name: Verify branch rehearsal snapshot
    needs: prepare
    if: needs.prepare.outputs.mode == 'branch-rehearsal'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: verify-rehearsal
      - run: |
          python3 .release-tooling/tools/ci_validation.py exec --env GITHUB_REPOSITORY -- \
            python3 .release-tooling/release-tools/release_job.py verify

  build-frontend:
    needs: [prepare, verify, verify-rehearsal]
    if: >-
      always() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.mode == 'branch-rehearsal' && needs.verify-rehearsal.result == 'success') ||
       (needs.prepare.outputs.mode != 'branch-rehearsal' && needs.verify.result == 'success'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: frontend
      - name: Build shared frontend once
        run: |
          python3 .release-tooling/tools/ci_validation.py exec --env GITHUB_REPOSITORY -- \
            python3 .release-tooling/release-tools/release_job.py frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
          if-no-files-found: error

  build-binaries:
    needs: [prepare, build-frontend]
    if: always() && needs.prepare.result == 'success' && needs.build-frontend.result == 'success'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: ${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5
        with:
          name: frontend-dist
          path: backend/internal/web/dist/
      - name: Compile and verify one target
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
        run: |
          python3 .release-tooling/tools/ci_validation.py exec --env GITHUB_REPOSITORY -- \
            python3 .release-tooling/release-tools/release_job.py binary --goos "$TARGET_GOOS" --goarch "$TARGET_GOARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4
        with:
          name: release-leaf-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release-leaf/
          if-no-files-found: error

  release:
    name: Build and publish
    needs: [prepare, verify, build-binaries]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.mode == 'publish' && needs.verify.result == 'success' && needs.build-binaries.result == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: publisher
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified artifacts and pricing last
        uses: ./.release-tooling/actions/release-package
        with:
          dry_run: 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  rehearse:
    name: Read-only packaging rehearsal
    needs: [prepare, verify, verify-rehearsal, build-binaries]
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.mode != 'publish' && needs.build-binaries.result == 'success' &&
      ((needs.prepare.outputs.mode == 'branch-rehearsal' && needs.verify-rehearsal.result == 'success') ||
       (needs.prepare.outputs.mode == 'tag-rehearsal' && needs.verify.result == 'success'))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: ./.github/actions/release-source
        with:
          sha: ${{ needs.prepare.outputs.sha }}
          lane: rehearsal
      - uses: ./.release-tooling/actions/release-package
        with:
          dry_run: 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
