name: Security Scan

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  backend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation
        with:
          lane: backend-security
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run backend-security checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: >-
          python3 tools/ci_validation.py lane --lane backend-security
          --base "$VALIDATION_BASE"

  frontend-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/prepare-validation
        with:
          lane: frontend-security
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run frontend-security checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: >-
          python3 tools/ci_validation.py lane --lane frontend-security
          --base "$VALIDATION_BASE"
