name: Security Scan

on:
  push:
    branches:
      - "**"
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify validation profile
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Set up Go
        if: steps.validation-profile.outputs.profile == 'full'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        if: steps.validation-profile.outputs.profile == 'full'
        working-directory: backend
        run: |
          test "$(go env GOVERSION)" = "go$(awk '/^go / { print $2 }' go.mod)"
      - name: Run govulncheck
        if: steps.validation-profile.outputs.profile == 'full'
        working-directory: backend
        run: |
          VERSION="$(awk '$1 == "govulncheck" { print $2 }' ../.tool-versions)"
          test -n "$VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@v${VERSION#v}"
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify validation profile
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Set up pnpm
        if: steps.validation-profile.outputs.profile == 'full'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: frontend/package.json
      - name: Set up Node.js
        if: steps.validation-profile.outputs.profile == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.validation-profile.outputs.profile == 'full'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        if: steps.validation-profile.outputs.profile == 'full'
        working-directory: frontend
        run: |
          pnpm audit --prod --audit-level=high --json > audit.json || true
      - name: Check audit exceptions
        if: steps.validation-profile.outputs.profile == 'full'
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
