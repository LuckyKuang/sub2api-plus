name: CI

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to verify"
        required: false
        type: string
      release-tag:
        description: "Release tag used to resolve the migration comparison base"
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  deployment-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: deployment-config
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run deployment-config checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane deployment-config
          --base "$VALIDATION_BASE"

  test-unit:
    name: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'test-unit-arm64' || 'test-unit' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: test-unit
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run test-unit checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane test-unit
          --base "$VALIDATION_BASE"

  test-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: test-integration
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run test-integration checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane test-integration
          --base "$VALIDATION_BASE"

  test:
    runs-on: ubuntu-24.04
    needs: [test-unit, test-integration]
    if: always()
    steps:
      - name: Require both architecture unit jobs and integration
        env:
          UNIT_RESULT: ${{ needs.test-unit.result }}
          INTEGRATION_RESULT: ${{ needs.test-integration.result }}
        run: |
          test "$UNIT_RESULT" = success
          test "$INTEGRATION_RESULT" = success

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: frontend
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run frontend checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane frontend
          --base "$VALIDATION_BASE"

  golangci-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: golangci-lint
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run golangci-lint checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane golangci-lint
          --base "$VALIDATION_BASE"

  goreleaser-config:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: goreleaser-config
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run goreleaser-config checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 tools/ci_validation.py lane --lane goreleaser-config
          --base "$VALIDATION_BASE"

  repository-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: ./.github/actions/prepare-validation
        with:
          lane: repository-policy
      - name: Classify validation profile in the validation container
        id: validation-profile
        uses: ./.github/actions/classify-release-finalization
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          branch: ${{ github.head_ref || github.ref_name }}
          default-branch: ${{ github.event.repository.default_branch }}
          event: ${{ github.event_name }}
      - name: Run repository-policy checks in the validation container
        if: steps.validation-profile.outputs.profile == 'full'
        env:
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          args=()
          if [ -n "$RELEASE_TAG" ]; then args+=(--tag "$RELEASE_TAG"); fi
          python3 tools/ci_validation.py lane --lane repository-policy --base "$VALIDATION_BASE" "${args[@]}"
      - name: Lint GitHub Actions workflows
        if: steps.validation-profile.outputs.profile == 'full'
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color
      - name: Verify published release finalization
        if: steps.validation-profile.outputs.profile == 'release-finalization'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.validation-profile.outputs.tag }}
          VALIDATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          python3 tools/ci_validation.py exec --env GH_TOKEN --env GITHUB_REPOSITORY -- \
            python3 tools/check_published_release.py \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          python3 tools/ci_validation.py lane --lane finalization \
            --base "$VALIDATION_BASE" --tag "$RELEASE_TAG"
