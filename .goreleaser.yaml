version: 2

project_name: sub2api

before:
  hooks:
    - go -C backend mod tidy -diff

builds:
  - id: sub2api
    dir: backend
    main: ./cmd/server
    binary: sub2api
    flags:
      - -tags=embed
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Commit={{.Commit}}
      - -X main.Date={{.Date}}
      - -X main.BuildType=release

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*
      - deploy/*
      # Pricing must be available at this exact relative path when a direct
      # binary archive runs without a remote pricing catalog.
      - src: backend/resources/model-pricing/model_prices_and_context_window.json
        dst: resources/model-pricing

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

changelog:
  # 禁用自动 changelog，完全使用 tag 消息
  disable: true

# Native Buildx release images. The architecture-specific tags remain
# available, while the multi-platform entries replace legacy docker manifests.
dockers_v2:
  # Docker Hub is intentionally skipped when the release workflow receives
  # DOCKERHUB_USERNAME=skip.
  - id: dockerhub-amd64
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["{{ .Env.DOCKERHUB_USERNAME }}/sub2api-plus"]
    tags: ["{{ .Env.DOCKER_TAG_VERSION }}-amd64"]
    platforms: [linux/amd64]
    disable: '{{ eq .Env.DOCKERHUB_USERNAME "skip" }}'
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"

  - id: dockerhub-arm64
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["{{ .Env.DOCKERHUB_USERNAME }}/sub2api-plus"]
    tags: ["{{ .Env.DOCKER_TAG_VERSION }}-arm64"]
    platforms: [linux/arm64]
    disable: '{{ eq .Env.DOCKERHUB_USERNAME "skip" }}'
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"

  - id: dockerhub-multiarch
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["{{ .Env.DOCKERHUB_USERNAME }}/sub2api-plus"]
    tags:
      - "{{ .Env.DOCKER_TAG_VERSION }}"
      - latest
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
    platforms: [linux/amd64, linux/arm64]
    disable: '{{ eq .Env.DOCKERHUB_USERNAME "skip" }}'
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"

  # GHCR images use the repository owner normalized by the release workflow.
  - id: ghcr-amd64
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api-plus"]
    tags: ["{{ .Env.DOCKER_TAG_VERSION }}-amd64"]
    platforms: [linux/amd64]
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

  - id: ghcr-arm64
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api-plus"]
    tags: ["{{ .Env.DOCKER_TAG_VERSION }}-arm64"]
    platforms: [linux/arm64]
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

  - id: ghcr-multiarch
    ids: [sub2api]
    dockerfile: Dockerfile.goreleaser
    images: ["ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api-plus"]
    tags:
      - "{{ .Env.DOCKER_TAG_VERSION }}"
      - latest
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}"
    platforms: [linux/amd64, linux/arm64]
    sbom: "false"
    extra_files: [deploy/docker-entrypoint.sh, backend/resources]
    labels:
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .Commit }}"
      org.opencontainers.image.source: "https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}"

release:
  github:
    owner: "{{ .Env.GITHUB_REPO_OWNER }}"
    name: "{{ .Env.GITHUB_REPO_NAME }}"
  draft: false
  prerelease: auto
  name_template: "Sub2API Plus {{.Version}}"
  # 完全使用 tag 消息作为 release 内容（通过环境变量传入）
  header: |
    > Sub2API Plus AI API Gateway Platform - 将 AI 订阅配额分发和管理

    {{ .Env.TAG_MESSAGE }}

  footer: |

    ---

    ## 📥 Installation

    **Docker:**
    ```bash
    {{ if ne .Env.DOCKERHUB_USERNAME "skip" -}}
    # Docker Hub
    docker pull {{ .Env.DOCKERHUB_USERNAME }}/sub2api-plus:{{ .Env.DOCKER_TAG_VERSION }}

    {{ end -}}
    # GitHub Container Registry
    docker pull ghcr.io/{{ .Env.GITHUB_REPO_OWNER_LOWER }}/sub2api-plus:{{ .Env.DOCKER_TAG_VERSION }}
    ```

    **One-line install (Linux):**
    ```bash
    curl -sSL https://raw.githubusercontent.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/{{ .Tag }}/deploy/install.sh | sudo bash -s -- install -v {{ .Tag }}
    ```

    **Manual download:**
    Download the appropriate archive for your platform from the assets below.

    ## 📚 Documentation

    - [GitHub Repository](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }})
    - [Installation Guide](https://github.com/{{ .Env.GITHUB_REPO_OWNER }}/{{ .Env.GITHUB_REPO_NAME }}/blob/{{ .Tag }}/deploy/README.md)
